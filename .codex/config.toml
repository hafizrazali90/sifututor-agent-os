[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/scripts/agent-checks/codex-pre-tool-use.py"'
timeout = 30
statusMessage = "Checking Sifututor Bash guardrails"

[[hooks.PostToolUse]]
matcher = "^Bash$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/scripts/agent-checks/codex-post-tool-use.py"'
timeout = 10
statusMessage = "Recording Bash result"
