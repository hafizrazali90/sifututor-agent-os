[features]
hooks = true

[sandbox_workspace_write]
writable_roots = ["~/.local/state/sifututor-agent-os/worktrees"]

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 /Users/hafizrazali/Projects/Sifututor/scripts/agent-checks/codex-pre-tool-dispatch.py'
timeout = 30
statusMessage = "Checking Agent OS safety rules"

[[hooks.PostToolUse]]
matcher = "^(Bash|exec_command|functions\\.exec)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 scripts/agent-checks/codex-post-tool-use.py'
timeout = 10
statusMessage = "Recording Bash result"

[[hooks.SessionStart]]
matcher = ".*"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'python3 /Users/hafizrazali/Projects/Sifututor/scripts/agent-checks/agent-os-approval-guard.py --resume'
timeout = 10
statusMessage = "Restoring the current task approval boundary"

[[hooks.SessionStart]]
matcher = "^(startup|resume|clear|compact)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 scripts/agent-checks/codex-lifecycle-hook.py"
timeout = 10
statusMessage = "Loading Sifututor session context"

[[hooks.UserPromptSubmit]]
matcher = ".*"

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'python3 /Users/hafizrazali/Projects/Sifututor/scripts/agent-checks/agent-os-approval-guard.py --identity'
timeout = 10
statusMessage = "Reading the current Agent OS session identity"

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 scripts/agent-checks/codex-lifecycle-hook.py"
timeout = 10
statusMessage = "Adding Sifututor prompt context"

[[hooks.PreCompact]]
matcher = "^(manual|auto)$"

[[hooks.PreCompact.hooks]]
type = "command"
command = "python3 scripts/agent-checks/codex-lifecycle-hook.py"
timeout = 10
statusMessage = "Preparing Sifututor compaction reminder"

[[hooks.Stop]]
matcher = ".*"

[[hooks.Stop.hooks]]
type = "command"
command = "python3 scripts/agent-checks/codex-lifecycle-hook.py"
timeout = 10
statusMessage = "Checking Sifututor session closeout"
