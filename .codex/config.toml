[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^(Bash|exec_command|functions\\.exec)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 scripts/agent-checks/secret_output_guard.py'
timeout = 10
statusMessage = "Preventing secret-bearing tool output"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 scripts/agent-checks/codex-pre-tool-use.py'
timeout = 30
statusMessage = "Checking Sifututor Bash guardrails"

[[hooks.PostToolUse]]
matcher = "^(Bash|exec_command|functions\\.exec)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 scripts/agent-checks/codex-post-tool-use.py'
timeout = 10
statusMessage = "Recording Bash result"

[[hooks.SessionStart]]
matcher = "^(startup|resume|clear|compact)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 scripts/agent-checks/codex-lifecycle-hook.py"
timeout = 10
statusMessage = "Loading Sifututor session context"

[[hooks.UserPromptSubmit]]
matcher = ".*"

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 scripts/agent-checks/codex-lifecycle-hook.py"
timeout = 10
statusMessage = "Adding Sifututor prompt context"

[[hooks.PreCompact]]
matcher = "^(manual|auto)$"

[[hooks.PreCompact.hooks]]
type = "command"
command = "python3 scripts/agent-checks/codex-lifecycle-hook.py"
timeout = 10
statusMessage = "Preparing Sifututor compaction reminder"

[[hooks.Stop]]
matcher = ".*"

[[hooks.Stop.hooks]]
type = "command"
command = "python3 scripts/agent-checks/codex-lifecycle-hook.py"
timeout = 10
statusMessage = "Checking Sifututor session closeout"
