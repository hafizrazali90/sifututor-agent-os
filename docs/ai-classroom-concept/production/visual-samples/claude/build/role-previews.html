<style>
#rolePreview{border:0;border-radius:24px;padding:0;margin:auto;inset:0;width:min(1080px,92vw);max-height:88dvh;background:#f5f5f7;color:#20252b;box-shadow:0 24px 90px #0003;font:20px/1.5 'IBM Plex Sans',sans-serif}
#rolePreview::backdrop{background:#18212999;backdrop-filter:blur(8px)}
#rolePreview .rp-head{position:sticky;top:0;z-index:1;background:#f5f5f7;padding:22px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e4e8;gap:20px}
#rolePreview button{font:inherit;border:1px solid #d5dce0;background:white;border-radius:12px;padding:10px 18px;color:inherit;cursor:pointer}
#rolePreview button:focus-visible,#b01 .card1:focus-visible{outline:3px solid #147d89;outline-offset:5px}
#rolePreview button[aria-pressed=true],#rolePreview .rp-primary{background:#137d89;color:white;border-color:#137d89}
#rolePreview .rp-body{padding:32px 40px 40px}#rolePreview h2{font:600 36px/1.2 Archivo,sans-serif;margin:0 0 18px}#rolePreview p{margin:12px 0 24px}
#rolePreview .rp-work{background:white;border-radius:18px;padding:28px;margin-top:24px}#rolePreview .rp-tabs{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
#rolePreview .rp-result{padding:22px;background:#e8f3f2;border-radius:14px;margin-top:20px}#rolePreview .rp-result p:last-child{margin-bottom:0}
#rolePreview .rp-small{font-size:16px;color:#53616b}#rolePreview .rp-record{display:grid;grid-template-columns:1fr 2fr;gap:18px;padding:16px 0;border-bottom:1px solid #e1e4e8}
#rolePreview .rp-paper{background:#fffdf7;padding:28px;border:1px solid #e6e3da;border-radius:8px}#rolePreview .rp-paper strong{font-size:28px}
#rolePreview[open]{display:block}#rolePreview:not([open]){display:none}
@media(max-width:820px){#rolePreview{font-size:17px;width:94vw;max-height:90dvh}#rolePreview .rp-head{padding:16px}#rolePreview .rp-body{padding:22px}#rolePreview h2{font-size:28px}#rolePreview .rp-work{padding:18px}#rolePreview .rp-record{grid-template-columns:1fr;gap:4px}}
@media print{#rolePreview{display:none!important}}
</style>
<dialog id="rolePreview" aria-labelledby="rpTitle">
 <div class="rp-head"><span id="rpContext"></span><button id="rpBack" type="button"></button></div>
 <div class="rp-body"><h2 id="rpTitle"></h2><p id="rpIntro"></p><div id="rpContent"></div><p class="rp-small" id="rpHonesty"></p></div>
</dialog>
<script>
(() => {
 const dialog=document.getElementById('rolePreview');
 let role=1,mode='paper',revealed=false,answer='',parentTab='progress',opener=null;
 const C={
 en:{back:'Back to everyone',context:'Explore the proposed experience',honesty:'Concept illustration. All names, records and responses are fictional. Teaching decisions remain with the teacher.',
 titles:['Turn answers into a next teaching step.','The same practice, on paper or online.','See progress and what to practise next.'],
 intros:['Cikgu Farah has checked the class’s answers. The class view brings repeated difficulties together so she can decide who needs help.','The teacher chooses the exercise. Students can work on paper without a device, or online with permitted access on their own device.','Aiman Hakim’s parent sees a summary reviewed by the teacher, not a live feed of every classroom action.'],
 topic:'4 Bestari · Comparing fractions',names:['Aiman Hakim','Haziq Iskandar','Nurul Aisyah'],records:['Missed comparing different denominators in three checks.','Missed comparing different denominators in three checks.','Answered these comparison questions correctly.'],ask:'Who needs help?',flag:'From the checked answers',insight:'Aiman and Haziq need another explanation of different denominators. The teacher can use fraction strips with this small group, then check again.',authority:'This is a rule-based example. The teacher decides whether the suggested response is suitable.',paper:'Paper',online:'Online',question:'Which is larger: ½ or ¼?',paperHint:'Circle your answer on the printed sheet. The teacher reviews the work.',onlineHint:'Try the same question online. This is a demonstration, not a saved student response.',correct:'Yes. With the same-sized whole, one half is larger than one quarter.',retry:'Compare equal-sized wholes. A half takes up more of the whole than a quarter. Try again.',progress:'Progress',next:'What to practise next',shared:'Shared by Cikgu Farah',progressText:'Aiman can identify equal parts. He still finds comparing fractions with different denominators difficult.',nextText:'Use two equal-sized pieces of paper. Fold one into halves and the other into quarters. Ask Aiman to compare one half with one quarter.',family:'Only this child’s teacher-shared summary is shown. No other student records are available.'},
 ms:{back:'Kembali kepada semua',context:'Terokai pengalaman yang dicadangkan',honesty:'Gambaran konsep. Semua nama, rekod dan respons ialah rekaan. Keputusan pengajaran kekal pada guru.',
 titles:['Daripada jawapan kepada langkah pengajaran.','Latihan yang sama, di atas kertas atau dalam talian.','Lihat kemajuan dan latihan seterusnya.'],
 intros:['Cikgu Farah telah menyemak jawapan kelas. Paparan kelas menghimpunkan kesukaran berulang supaya beliau boleh menentukan siapa yang memerlukan bantuan.','Guru memilih latihan. Murid boleh menjawab di atas kertas tanpa peranti, atau dalam talian dengan akses dibenarkan melalui peranti sendiri.','Ibu bapa Aiman Hakim melihat ringkasan yang disemak guru, bukan paparan langsung setiap aktiviti kelas.'],
 topic:'4 Bestari · Membandingkan pecahan',names:['Aiman Hakim','Haziq Iskandar','Nurul Aisyah'],records:['Tersilap membandingkan penyebut berbeza dalam tiga semakan.','Tersilap membandingkan penyebut berbeza dalam tiga semakan.','Menjawab soalan perbandingan ini dengan betul.'],ask:'Siapa yang memerlukan bantuan?',flag:'Daripada jawapan yang disemak',insight:'Aiman dan Haziq memerlukan penerangan semula tentang penyebut berbeza. Guru boleh menggunakan jalur pecahan bersama kumpulan kecil ini, kemudian menyemak semula.',authority:'Ini contoh berasaskan peraturan. Guru menentukan sama ada tindakan yang dicadangkan sesuai.',paper:'Kertas',online:'Dalam talian',question:'Yang manakah lebih besar: ½ atau ¼?',paperHint:'Bulatkan jawapan pada helaian bercetak. Guru menyemak hasil kerja.',onlineHint:'Cuba soalan yang sama dalam talian. Ini demonstrasi, bukan respons murid yang disimpan.',correct:'Betul. Bagi keseluruhan yang sama saiz, satu perdua lebih besar daripada satu perempat.',retry:'Bandingkan keseluruhan yang sama saiz. Satu perdua meliputi lebih banyak bahagian berbanding satu perempat. Cuba lagi.',progress:'Kemajuan',next:'Latihan seterusnya',shared:'Dikongsi oleh Cikgu Farah',progressText:'Aiman boleh mengenal pasti bahagian sama besar. Dia masih sukar membandingkan pecahan dengan penyebut berbeza.',nextText:'Gunakan dua keping kertas yang sama saiz. Lipat satu kepada dua bahagian dan satu lagi kepada empat bahagian. Minta Aiman membandingkan satu perdua dengan satu perempat.',family:'Hanya ringkasan anak ini yang dikongsi guru dipaparkan. Rekod murid lain tidak tersedia.'}
 };
 const button=(id,text,on)=>`<button type="button" data-rp="${id}"${on===undefined?'':` aria-pressed="${on}"`}>${text}</button>`;
 function draw(){const d=C[lang]||C.en;
  document.getElementById('rpBack').textContent=d.back;document.getElementById('rpContext').textContent=d.context;document.getElementById('rpTitle').textContent=d.titles[role-1];document.getElementById('rpIntro').textContent=d.intros[role-1];document.getElementById('rpHonesty').textContent=d.honesty;
  let body='';
  if(role===1)body=`<div class="rp-work"><b>${d.topic}</b>${d.names.map((n,i)=>`<div class="rp-record"><strong>${n}</strong><span>${d.records[i]}</span></div>`).join('')}<div class="rp-tabs">${button('reveal',d.ask,revealed)}</div><div class="rp-result" aria-live="polite" ${revealed?'':'hidden'}><b>${d.flag}</b><p>${d.insight}</p><p class="rp-small">${d.authority}</p></div></div>`;
  if(role===2)body=`<div class="rp-tabs">${button('paper',d.paper,mode==='paper')}${button('online',d.online,mode==='online')}</div><div class="rp-paper"><b>Aiman Hakim · 4 Bestari</b><p><strong>${d.question}</strong></p>${mode==='paper'?`<p>½ &nbsp;&nbsp;&nbsp;&nbsp; ¼</p><p>${d.paperHint}</p>`:`<div class="rp-tabs">${button('half','½',answer==='half')}${button('quarter','¼',answer==='quarter')}</div><p>${d.onlineHint}</p><div class="rp-result" aria-live="polite" ${answer?'':'hidden'}>${answer==='half'?d.correct:d.retry}</div>`}</div>`;
  if(role===3)body=`<div class="rp-work"><b>Aiman Hakim · 4 Bestari</b><p class="rp-small">${d.shared}</p><div class="rp-tabs">${button('progress',d.progress,parentTab==='progress')}${button('next',d.next,parentTab==='next')}</div><div class="rp-result" aria-live="polite">${parentTab==='progress'?d.progressText:d.nextText}</div><p class="rp-small">${d.family}</p></div>`;
  document.getElementById('rpContent').innerHTML=body;
 }
 function open(n,el){role=n;mode='paper';revealed=false;answer='';parentTab='progress';opener=el;draw();dialog.showModal();document.getElementById('rpBack').focus();}
 window.openRolePreview=open;
 function close(){if(dialog.open)dialog.close();}
 document.getElementById('rpBack').onclick=close;
 dialog.addEventListener('close',()=>{if(opener)opener.focus();});
 dialog.addEventListener('click',e=>{const b=e.target.closest('[data-rp]');if(!b)return;const a=b.dataset.rp;if(a==='reveal')revealed=!revealed;else if(['paper','online'].includes(a)){mode=a;answer='';}else if(['half','quarter'].includes(a))answer=a;else parentTab=a;draw();dialog.querySelector(`[data-rp="${a}"]`)?.focus();});
 document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();close();}else if(e.key.toLowerCase()==='r'){e.stopImmediatePropagation();mode='paper';answer='';revealed=false;parentTab='progress';draw();}else if(['ArrowLeft','ArrowRight','Home','End',' '].includes(e.key)){e.stopImmediatePropagation();}},true);
 document.querySelectorAll('#b01 .card1').forEach(c=>{c.setAttribute('role','button');c.tabIndex=0;c.setAttribute('aria-haspopup','dialog');c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();c.click();}});});
 new MutationObserver(()=>{if(!document.getElementById('b01').classList.contains('active'))close();}).observe(document.getElementById('b01'),{attributes:true,attributeFilter:['class']});
 window.addEventListener('beforeprint',close);
 const previousPDF=pdfMode;pdfMode=function(on){if(on)close();const result=previousPDF(on);if(on){const sub=document.querySelector('#b01 [data-i="b01s"]');sub.textContent=sub.textContent.replace(' Click a photo to try an example.','').replace(' Sentuh foto untuk mencuba contoh.','');}return result;};
})();
</script>
